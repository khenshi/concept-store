name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 20.19.4

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: concept_store_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d concept_store_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/concept_store_ci
      DIRECT_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/concept_store_ci
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/concept_store_ci
      FRONTEND_ORIGIN: http://127.0.0.1:3001
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      REFRESH_COOKIE_PATH: /auth
      LOG_DB_QUERY_PARAMETERS: "false"
      SWAGGER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend formatting
        working-directory: backend
        run: npm run format:check
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      - name: Validate and generate Prisma client
        working-directory: backend
        run: |
          npm run prisma:validate
          npm run prisma:generate
      - name: Typecheck backend and test sources
        working-directory: backend
        run: npm run typecheck
      - name: Run backend unit tests
        working-directory: backend
        run: npm test -- --runInBand
      - name: Run backend HTTP tests
        working-directory: backend
        run: npm run test:e2e -- --runInBand
      - name: Run backend PostgreSQL tests
        working-directory: backend
        run: npm run test:integration
      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  runtime:
    name: Built runtime and proxy smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: concept_store_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d concept_store_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/concept_store_ci
      DIRECT_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/concept_store_ci
      TEST_RUNTIME_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/concept_store_ci
      TEST_RUNTIME_DATABASE_NAME: concept_store_ci
      TEST_RUNTIME_PORT: "3100"
      FRONTEND_ORIGIN: http://127.0.0.1:3101
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_runtime_test
      EMAIL_FROM: 'CI <no-reply@example.com>'
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      REFRESH_COOKIE_PATH: /auth
      LOG_DB_QUERY_PARAMETERS: "false"
      SWAGGER_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Build frontend for the same-origin proxy
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3101/api
          NEXT_API_UPSTREAM_URL: http://127.0.0.1:3100
        run: npm run build
      - name: Smoke built backend
        working-directory: backend
        run: npm run test:runtime:ci
      - name: Smoke frontend proxy against built backend
        shell: bash
        run: |
          set -euo pipefail
          api_pid=''
          frontend_pid=''
          cleanup() {
            if [[ -n "$frontend_pid" ]]; then kill "$frontend_pid" 2>/dev/null || true; fi
            if [[ -n "$api_pid" ]]; then kill "$api_pid" 2>/dev/null || true; fi
            if [[ -n "$frontend_pid" ]]; then wait "$frontend_pid" 2>/dev/null || true; fi
            if [[ -n "$api_pid" ]]; then wait "$api_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          (
            cd backend
            NODE_ENV=production PORT=3100 node dist/src/main.js >/tmp/concept-store-ci-api.log 2>&1
          ) &
          api_pid=$!
          api_ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/health/ready >/dev/null; then
              api_ready=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          test "$api_ready" -eq 1
          (
            cd frontend
            NODE_ENV=production PORT=3101 \
              NEXT_PUBLIC_API_URL=http://127.0.0.1:3101/api \
              NEXT_API_UPSTREAM_URL=http://127.0.0.1:3100 \
              node scripts/start.mjs >/tmp/concept-store-ci-frontend.log 2>&1
          ) &
          frontend_pid=$!
          frontend_ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3101/ >/dev/null; then
              frontend_ready=1
              break
            fi
            if ! kill -0 "$frontend_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          test "$frontend_ready" -eq 1
          response=$(curl --fail --silent --show-error --max-time 5 'http://127.0.0.1:3101/api/health/live?ci=1')
          test "$response" = '{"status":"ok"}'

  required:
    name: Required checks
    if: ${{ always() }}
    needs:
      - backend
      - frontend
      - runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when a mandatory job did not pass
        if: >-
          ${{ needs.backend.result != 'success' || needs.frontend.result != 'success' || needs.runtime.result != 'success' }}
        run: exit 1
