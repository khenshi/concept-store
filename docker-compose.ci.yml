services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: concept_store_ci
    ports:
      - "127.0.0.1:${CI_POSTGRES_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d concept_store_ci"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"
